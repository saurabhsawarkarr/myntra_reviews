<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaned Data Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .data-page { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .data-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .back-btn { background: #e2e8f0; padding: 0.5rem 1rem; border-radius: 0.5rem; text-decoration: none; color: #0f172a; font-weight: 600; font-size: 0.85rem; }
        .back-btn:hover { background: #cbd5e1; }
        .pagination { display: flex; align-items: center; gap: 1rem; margin-top: 1.5rem; justify-content: center; }
        .page-btn { padding: 0.5rem 1rem; background: var(--blue); color: white; border: none; border-radius: 0.25rem; cursor: pointer; font-weight: 600; }
        .page-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        #loading { text-align: center; padding: 4rem; color: var(--muted); }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="data-page">
    <div class="data-header">
        <div>
            <h1 class="page-title">Cleaned Data Explorer</h1>
            <p class="page-sub" id="record-count">Loading dataset...</p>
        </div>
        <a href="index.html" class="back-btn">&larr; Back to Dashboard</a>
    </div>

    <div class="card">
        <div id="loading">
            <div class="spinner"></div>
            <p>Downloading full dataset (this may take a moment)...</p>
        </div>
        <div id="table-container" style="display:none; overflow-x: auto;">
            <table class="data-table">
                <thead>
                    <tr><th>Date</th><th>Rating</th><th>Source</th><th>Cleaned Review Text</th></tr>
                </thead>
                <tbody id="data-tbody"></tbody>
            </table>
        </div>
    </div>

    <div class="pagination" id="pagination" style="display:none;">
        <button id="prevBtn" class="page-btn">Previous</button>
        <span id="pageInfo" style="font-weight:600; font-size:0.9rem;">Page 1 of 1</span>
        <button id="nextBtn" class="page-btn">Next</button>
    </div>
</div>

<script src="data.js"></script>
</body>
</html>
